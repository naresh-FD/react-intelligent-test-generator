<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">TDD flow from technical document to verified GREEN</title><desc id="d">Seven-step flow with human checkpoints and the conditions under which the flow stops.</desc><defs><marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="1600" height="620" fill="#f1f5f9"/><rect width="1600" height="104" fill="url(#hdr)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start"><tspan x="40" dy="0.0">TDD Flow: Document to Verified GREEN</tspan></text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#dbeafe" text-anchor="start"><tspan x="40" dy="0.0">Where TestGen decides, where a person decides, and what is written at each step.</tspan></text><text x="1560" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#dbeafe" text-anchor="end"><tspan x="1560" dy="0.0">No model in this path</tspan></text><text x="1560" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#bfdbfe" text-anchor="end"><tspan x="1560" dy="0.0">no network · no installs</tspan></text><rect x="49.0" y="170" width="194" height="230" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6"/><circle cx="146.0" cy="206" r="20" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><path d="M137.0 206 l6.4 6.800000000000001 l12.0 -13.200000000000001" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="146.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="146.0" dy="0.0">Technical document</tspan></text><text x="146.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="146.0" dy="0.0">Requirements + optional</tspan><tspan x="146.0" dy="16.9">Implementation target:</tspan><tspan x="146.0" dy="16.9">path#Symbol</tspan></text><rect x="59.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><text x="146.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="146.0" dy="0.0">testgen document</tspan></text><line x1="246.0" y1="285" x2="264.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="267.0" y="170" width="194" height="230" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6"/><circle cx="364.0" cy="206" r="20" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><path d="M355.0 206 l6.4 6.800000000000001 l12.0 -13.200000000000001" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="364.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="364.0" dy="0.0">TDD plan</tspan></text><text x="364.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="364.0" dy="0.0">Project mode, cycles,</tspan><tspan x="364.0" dy="16.9">recipes, conventions.</tspan><tspan x="364.0" dy="16.9">Writes nothing.</tspan></text><rect x="277.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><text x="364.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="364.0" dy="0.0">testgen tdd plan</tspan></text><line x1="464.0" y1="285" x2="482.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="485.0" y="170" width="194" height="230" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><circle cx="582.0" cy="206" r="20" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><path d="M582.0 194.4 L592.0 199.6 V207.0 Q592.0 215.0 582.0 218.4 Q572.0 215.0 572.0 207.0 V199.6 Z" fill="#6d28d9"/><text x="582.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="582.0" dy="0.0">Mapping approval</tspan></text><text x="582.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="582.0" dy="0.0">A person approves one</tspan><tspan x="582.0" dy="16.9">listed candidate.</tspan><tspan x="582.0" dy="16.9">Hash-bound, goes stale.</tspan></text><rect x="495.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/><text x="582.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle"><tspan x="582.0" dy="0.0">testgen mapping approve</tspan></text><line x1="682.0" y1="285" x2="700.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="703.0" y="170" width="194" height="230" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6"/><circle cx="800.0" cy="206" r="20" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><path d="M791.0 206 l6.4 6.800000000000001 l12.0 -13.200000000000001" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="800.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="800.0" dy="0.0">First RED</tspan></text><text x="800.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="800.0" dy="0.0">One test, run with the</tspan><tspan x="800.0" dy="16.9">project&#x27;s runner, must</tspan><tspan x="800.0" dy="16.9">fail for missing behaviour.</tspan></text><rect x="713.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><text x="800.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="800.0" dy="0.0">testgen tdd red establish</tspan></text><line x1="900.0" y1="285" x2="918.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="921.0" y="170" width="194" height="230" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><circle cx="1018.0" cy="206" r="20" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><path d="M1018.0 194.4 L1028.0 199.6 V207.0 Q1028.0 215.0 1018.0 218.4 Q1008.0 215.0 1008.0 207.0 V199.6 Z" fill="#6d28d9"/><text x="1018.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1018.0" dy="0.0">Freeze</tspan></text><text x="1018.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1018.0" dy="0.0">Test hash, target,</tspan><tspan x="1018.0" dy="16.9">project baseline.</tspan><tspan x="1018.0" dy="16.9">Create-only.</tspan></text><rect x="931.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/><text x="1018.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle"><tspan x="1018.0" dy="0.0">.testgen/red/*.frozen.json</tspan></text><line x1="1118.0" y1="285" x2="1136.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="1139.0" y="170" width="194" height="230" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/><circle cx="1236.0" cy="206" r="20" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><path d="M1236.0 193.6 A12.4 12.4 0 0 1 1236.0 218.4 Z" fill="#b45309"/><text x="1236.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1236.0" dy="0.0">Fix</tspan></text><text x="1236.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1236.0" dy="0.0">Written by a person or</tspan><tspan x="1236.0" dy="16.9">another tool.</tspan><tspan x="1236.0" dy="16.9">TestGen writes no code.</tspan></text><rect x="1149.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/><text x="1236.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle"><tspan x="1236.0" dy="0.0">your editor / Copilot</tspan></text><line x1="1336.0" y1="285" x2="1354.0" y2="285" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow-muted)"/><rect x="1357.0" y="170" width="194" height="230" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/><circle cx="1454.0" cy="206" r="20" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><path d="M1454.0 194.4 L1464.0 199.6 V207.0 Q1464.0 215.0 1454.0 218.4 Q1444.0 215.0 1444.0 207.0 V199.6 Z" fill="#6d28d9"/><text x="1454.0" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1454.0" dy="0.0">GREEN gate</tspan></text><text x="1454.0" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="1454.0" dy="0.0">Scope, frozen test passes,</tspan><tspan x="1454.0" dy="16.9">siblings still pass.</tspan><tspan x="1454.0" dy="16.9">Records GREEN.</tspan></text><rect x="1367.0" y="354" width="174" height="32" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/><text x="1454.0" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle"><tspan x="1454.0" dy="0.0">testgen tdd green verify</tspan></text><text x="40" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#b91c1c" text-anchor="start"><tspan x="40" dy="0.0">Where the flow stops (fail closed)</tspan></text><rect x="40.0" y="452" width="368.0" height="92" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/><circle cx="68.0" cy="484" r="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M63.06 479.06 L72.94 488.94 M72.94 479.06 L63.06 488.94" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="90.0" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="90.0" dy="0.0">Mapping not accepted: review required or</tspan><tspan x="90.0" dy="18.2">blocked</tspan></text><text x="90.0" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="90.0" dy="0.0">nothing is generated</tspan></text><rect x="424.0" y="452" width="368.0" height="92" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/><circle cx="452.0" cy="484" r="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M447.06 479.06 L456.94 488.94 M456.94 479.06 L447.06 488.94" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="474.0" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="474.0" dy="0.0">RED does not prove the behaviour is</tspan><tspan x="474.0" dy="18.2">missing</tspan></text><text x="474.0" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="474.0" dy="0.0">test rolled back, never frozen</tspan></text><rect x="808.0" y="452" width="368.0" height="92" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/><circle cx="836.0" cy="484" r="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M831.06 479.06 L840.94 488.94 M840.94 479.06 L831.06 488.94" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="858.0" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="858.0" dy="0.0">Fix touches a test, config or another</tspan><tspan x="858.0" dy="18.2">file</tspan></text><text x="858.0" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="858.0" dy="0.0">OUT_OF_SCOPE / TEST_FILES_CHANGED</tspan></text><rect x="1192.0" y="452" width="368.0" height="92" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/><circle cx="1220.0" cy="484" r="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1215.06 479.06 L1224.94 488.94 M1224.94 479.06 L1215.06 488.94" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1242.0" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1242.0" dy="0.0">Frozen test fails or a sibling test</tspan><tspan x="1242.0" dy="18.2">breaks</tspan></text><text x="1242.0" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="1242.0" dy="0.0">STILL_RED / SIBLING_REGRESSION</tspan></text><rect y="574" width="1600" height="46" fill="#1e3a8a"/><text x="800.0" y="602" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#dbeafe" text-anchor="middle"><tspan x="800.0" dy="0.0">Legend:  check = TestGen step   ·   shield = deterministic gate or human checkpoint   ·   half = outside TestGen   ·   GREEN gate: in review</tspan></text></svg>

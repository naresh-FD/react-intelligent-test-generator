<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d"><title id="t">Phase 6 GREEN gate</title><desc id="d">Five ordered checks of the GREEN gate with their refusal codes, the success record, and what the gate never does.</desc><defs><marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="1600" height="880" fill="#f1f5f9"/><rect width="1600" height="104" fill="url(#hdr)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start"><tspan x="40" dy="0.0">Phase 6: the GREEN Gate (in review)</tspan></text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#dbeafe" text-anchor="start"><tspan x="40" dy="0.0">testgen tdd green verify --freeze &lt;file&gt; [--allow &lt;file&gt;]  ·  stops at the first failing check</tspan></text><text x="1560" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#dbeafe" text-anchor="end"><tspan x="1560" dy="0.0">In review: not merged to main yet</tspan></text><text x="1560" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#bfdbfe" text-anchor="end"><tspan x="1560" dy="0.0">writes only .testgen/green/&lt;req&gt;.green.json</tspan></text><rect x="40" y="140" width="900" height="82" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="82" cy="181.0" r="22" fill="#6d28d9"/><text x="82" y="189.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="82" dy="0.0">1</tspan></text><text x="122" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="122" dy="0.0">Freeze intact, test unmodified</tspan></text><text x="122" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="122" dy="0.0">refuses with  FREEZE_TAMPERED · TEST_MODIFIED · TEST_MISSING</tspan></text><line x1="944" y1="181.0" x2="1010" y2="181.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><rect x="70" y="236" width="840" height="82" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="112" cy="277.0" r="22" fill="#6d28d9"/><text x="112" y="285.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="112" dy="0.0">2</tspan></text><text x="152" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="152" dy="0.0">Baseline intact, no GREEN recorded yet</tspan></text><text x="152" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="152" dy="0.0">refuses with  BASELINE_TAMPERED · FREEZE_LACKS_BASELINE · GREEN_ALREADY_RECORDED</tspan></text><line x1="914" y1="277.0" x2="1010" y2="277.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><rect x="100" y="332" width="780" height="82" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="142" cy="373.0" r="22" fill="#6d28d9"/><text x="142" y="381.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="142" dy="0.0">3</tspan></text><text x="182" y="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="182" dy="0.0">Scope: only the approved target changed</tspan></text><text x="182" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="182" dy="0.0">refuses with  NO_PRODUCTION_CHANGE · TEST_FILES_CHANGED · OUT_OF_SCOPE_CHANGE</tspan></text><line x1="884" y1="373.0" x2="1010" y2="373.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><rect x="130" y="428" width="720" height="82" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="172" cy="469.0" r="22" fill="#6d28d9"/><text x="172" y="477.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="172" dy="0.0">4</tspan></text><text x="212" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="212" dy="0.0">Frozen test passes with the project&#x27;s runner</tspan></text><text x="212" y="488" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="212" dy="0.0">refuses with  STILL_RED · DEPENDENCIES_NOT_AVAILABLE</tspan></text><line x1="854" y1="469.0" x2="1010" y2="469.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><rect x="160" y="524" width="660" height="82" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="202" cy="565.0" r="22" fill="#6d28d9"/><text x="202" y="573.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="202" dy="0.0">5</tspan></text><text x="242" y="558" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="242" dy="0.0">Every other test that uses the target passes</tspan></text><text x="242" y="584" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start"><tspan x="242" dy="0.0">refuses with  SIBLING_REGRESSION · SIBLING_SCAN_FAILED</tspan></text><line x1="824" y1="565.0" x2="1010" y2="565.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><rect x="1016" y="140" width="260" height="466" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><circle cx="1146" cy="200" r="24" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1136.88 190.88 L1155.12 209.12 M1155.12 190.88 L1136.88 209.12" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1146" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#b91c1c" text-anchor="middle"><tspan x="1146" dy="0.0">REFUSED or STILL_RED</tspan></text><text x="1036" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start"><tspan x="1036" dy="0.0">Nothing is recorded. The</tspan><tspan x="1036" dy="18.2">code, the tests and the</tspan><tspan x="1036" dy="18.2">freeze are left exactly as</tspan><tspan x="1036" dy="18.2">they are, so the fix can be</tspan><tspan x="1036" dy="18.2">corrected and verified again.</tspan></text><line x1="490.0" y1="612" x2="490.0" y2="636" stroke="#15803d" stroke-width="2.6" marker-end="url(#arrow-green)"/><rect x="40" y="640" width="900" height="112" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><circle cx="84" cy="696" r="22" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><path d="M74.1 696 l7.04 7.48 l13.2 -14.520000000000001" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="682" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#15803d" text-anchor="start"><tspan x="124" dy="0.0">GREEN_VERIFIED: record written once, never rewritten</tspan></text><text x="124" y="710" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start"><tspan x="124" dy="0.0">changed files with before/after hashes · files a person allowed · pass/fail counts · sibling tests</tspan><tspan x="124" dy="18.2">run · freeze, plan and test hashes · greenHash</tspan></text><rect x="1300" y="140" width="260" height="470" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1324" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="1324" dy="0.0">Never</tspan></text><circle cx="1336" cy="214" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 209.82 L1340.18 218.18 M1340.18 209.82 L1331.82 218.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="219" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">writes production code</tspan></text><circle cx="1336" cy="266" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 261.82 L1340.18 270.18 M1340.18 261.82 L1331.82 270.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">edits or adds a test</tspan></text><circle cx="1336" cy="318" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 313.82 L1340.18 322.18 M1340.18 313.82 L1331.82 322.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="323" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">calls a model</tspan></text><circle cx="1336" cy="370" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 365.82 L1340.18 374.18 M1340.18 365.82 L1331.82 374.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="375" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">uses the network</tspan></text><circle cx="1336" cy="422" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 417.82 L1340.18 426.18 M1340.18 417.82 L1331.82 426.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="427" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">installs a dependency</tspan></text><circle cx="1336" cy="474" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 469.82 L1340.18 478.18 M1340.18 469.82 L1331.82 478.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="479" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">lets --allow name a test</tspan></text><circle cx="1336" cy="526" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1331.82 521.82 L1340.18 530.18 M1340.18 521.82 L1331.82 530.18" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1356" y="531" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1356" dy="0.0">trusts git or a diff it</tspan><tspan x="1356" dy="18.9">did not compute</tspan></text><rect x="1300" y="626" width="260" height="172" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="1324" y="656" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#2563eb" text-anchor="start"><tspan x="1324" dy="0.0">tdd green inspect</tspan></text><text x="1324" y="686" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start"><tspan x="1324" dy="0.0">GREEN_VERIFIED</tspan></text><text x="1324" y="712" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start"><tspan x="1324" dy="0.0">GREEN_STALE</tspan></text><text x="1324" y="738" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start"><tspan x="1324" dy="0.0">GREEN_TAMPERED</tspan></text><text x="1324" y="764" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start"><tspan x="1324" dy="0.0">GREEN_UNREADABLE</tspan></text><rect y="834" width="1600" height="46" fill="#1e3a8a"/><text x="800.0" y="862" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#dbeafe" text-anchor="middle"><tspan x="800.0" dy="0.0">Siblings = tests that import the target symbol (max 20). Scope is file-level. Mutation testing is not part of this gate.</tspan></text></svg>

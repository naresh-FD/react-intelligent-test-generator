<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="t d"><title id="t">AIS roadmap phases 0 to 6</title><desc id="d">Timeline of AIS roadmap phases 0 through 6 with a short description of each, and the next planned items.</desc><defs><marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="1600" height="640" fill="#f1f5f9"/><rect width="1600" height="104" fill="url(#hdr)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start"><tspan x="40" dy="0.0">AIS Roadmap: Phases 0-6</tspan></text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#dbeafe" text-anchor="start"><tspan x="40" dy="0.0">From a technical document to a verified GREEN. Each phase adds a gate, not an autonomous step.</tspan></text><text x="1560" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#dbeafe" text-anchor="end"><tspan x="1560" dy="0.0">All phases: EXPERIMENTAL</tspan></text><text x="1560" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#bfdbfe" text-anchor="end"><tspan x="1560" dy="0.0">see docs/product-status.md</tspan></text><line x1="150" y1="300" x2="1450" y2="300" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round"/><line x1="150" y1="300" x2="1450" y2="300" stroke="#15803d" stroke-width="4" stroke-linecap="round"/><circle cx="150.0" cy="300" r="30" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="150.0" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="150.0" dy="0.0">0</tspan></text><rect x="43.0" y="132" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="150.0" y1="256" x2="150.0" y2="270" stroke="#bbf7d0" stroke-width="2"/><text x="150.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="150.0" dy="0.0">Trust boundary</tspan></text><text x="57.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="57.0" dy="0.0">Mapping thresholds,</tspan><tspan x="57.0" dy="16.9">grounding, path</tspan><tspan x="57.0" dy="16.9">containment, safe writer,</tspan><tspan x="57.0" dy="16.9">egress gate.</tspan></text><circle cx="366.66666666666663" cy="300" r="30" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="366.66666666666663" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="366.66666666666663" dy="0.0">1</tspan></text><rect x="259.66666666666663" y="344" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="366.66666666666663" y1="330" x2="366.66666666666663" y2="344" stroke="#bbf7d0" stroke-width="2"/><text x="366.66666666666663" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="366.66666666666663" dy="0.0">Document contract</tspan></text><text x="273.66666666666663" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="273.66666666666663" dy="0.0">One hashed</tspan><tspan x="273.66666666666663" dy="16.9">technical-document</tspan><tspan x="273.66666666666663" dy="16.9">contract with source</tspan><tspan x="273.66666666666663" dy="16.9">pointers.</tspan></text><circle cx="583.3333333333333" cy="300" r="30" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="583.3333333333333" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="583.3333333333333" dy="0.0">2</tspan></text><rect x="476.33333333333326" y="132" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="583.3333333333333" y1="256" x2="583.3333333333333" y2="270" stroke="#bbf7d0" stroke-width="2"/><text x="583.3333333333333" y="160" font-family="system-ui, -apple-system, 'Segoe 
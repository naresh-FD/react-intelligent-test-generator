ll="#15803d" text-anchor="middle"><tspan x="1016.6666666666666" dy="0.0">4</tspan></text><rect x="909.6666666666666" y="132" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="1016.6666666666666" y1="256" x2="1016.6666666666666" y2="270" stroke="#bbf7d0" stroke-width="2"/><text x="1016.6666666666666" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1016.6666666666666" dy="0.0">TDD plan + Conduit</tspan></text><text x="923.6666666666666" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="923.6666666666666" dy="0.0">Project-aware cycles;</tspan><tspan x="923.6666666666666" dy="16.9">human mapping approval;</tspan><tspan x="923.6666666666666" dy="16.9">read-only capability ops.</tspan></text><circle cx="1233.3333333333333" cy="300" r="30" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="1233.3333333333333" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="1233.3333333333333" dy="0.0">5</tspan></text><rect x="1126.3333333333333" y="344" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="1233.3333333333333" y1="330" x2="1233.3333333333333" y2="344" stroke="#bbf7d0" stroke-width="2"/><text x="1233.3333333333333" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1233.3333333333333" dy="0.0">Bootstrap + first RED</tspan></text><text x="1140.3333333333333" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="1140.3333333333333" dy="0.0">Explicit profile</tspan><tspan x="1140.3333333333333" dy="16.9">bootstrap; one RED proven</tspan><tspan x="1140.3333333333333" dy="16.9">and frozen.</tspan></text><circle cx="1450.0" cy="300" r="30" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="1450.0" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="middle"><tspan x="1450.0" dy="0.0">6</tspan></text><rect x="1343.0" y="132" width="214" height="124" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/><line x1="1450.0" y1="256" x2="1450.0" y2="270" stroke="#bbf7d0" stroke-width="2"/><text x="1450.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle"><tspan x="1450.0" dy="0.0">GREEN gate</tspan></text><text x="1357.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start"><tspan x="1357.0" dy="0.0">Verifies a fix against the</tspan><tspan x="1357.0" dy="16.9">frozen RED: scope, pass,</tspan><tspan x="1357.0" dy="16.9">no regression. In review:</tspan><tspan x="1357.0" dy="16.9">not on main yet.</tspan></text><rect x="40" y="510" width="1520" height="70" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><circle cx="76" cy="545" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><path d="M76 537.0 V545 L82.08 548.52" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/><text x="104" y="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#2563eb" text-anchor="start"><tspan x="104" dy="0.0">Next (not built)</tspan></text><text x
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="t d"><title id="t">Mapping trust boundary</title><desc id="d">Scorer weights, fixed policy thresholds, the document-declared target lane, acceptance outcomes and the human approval lifecycle.</desc><defs><marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="1600" height="700" fill="#f1f5f9"/><rect width="1600" height="104" fill="url(#hdr)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start"><tspan x="40" dy="0.0">Mapping: from Requirement to Accepted Target</tspan></text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#dbeafe" text-anchor="start"><tspan x="40" dy="0.0">One deterministic boundary decides. Thresholds are fixed; a document declaration lists, a person approves.</tspan></text><text x="1560" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#dbeafe" text-anchor="end"><tspan x="1560" dy="0.0">evaluateMappingAcceptance</tspan></text><text x="1560" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#bfdbfe" text-anchor="end"><tspan x="1560" dy="0.0">src/mapping/acceptance.ts</tspan></text><rect x="40" y="140" width="300" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="64" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="64" dy="0.0">Scorer</tspan></text><text x="64" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="start"><tspan x="64" dy="0.0">Evidence-weighted confidence</tspan></text><text x="64" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">explicit reference</tspan></text><rect x="214" y="226" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="226" width="100.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.25</tspan></text><text x="64" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">git history</tspan></text><rect x="214" y="254" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="254" width="80.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.20</tspan></text><text x="64" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">call graph</tspan></text><rect x="214" y="282" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="282" width="80.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.20</tspan></text><text x="64" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">lexical</tspan></text><rect x="214" y="310" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="310" width="40.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.10</tspan></text><text x="64" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">semantic</tspan></text><rect x="214" y="338" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="338" width="40.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.10</tspan></text><text x="64" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">other</tspan></text><rect x="214" y="366" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="366" width="60.0" height="14" rx="7" fill="#2563eb"/><text x="320" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.15</tspan></text><text x="64" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start"><tspan x="64" dy="0.0">doc declaration</tspan></text><rect x="214" y="394" width="100" height="14" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="320" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start"><tspan x="320" dy="0.0">0.00</tspan></text><text x="400" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="400" dy="0.0">Policy by confidence (unchanged)</tspan></text><rect x="400.0" y="176" width="246.66666666666666" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="414.0" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="start"><tspan x="414.0" dy="0.0">blocked</tspan></text><text x="632.6666666666666" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end"><tspan x="632.6666666666666" dy="0.0">&lt; 0.65</tspan></text><text x="414.0" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="414.0" dy="0.0">never generated, never</tspan><tspan x="414.0" dy="16.2">approvable</tspan></text><rect x="656.6666666666666" y="176" width="246.66666666666666" height="78" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="670.6666666666666" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="670.6666666666666" dy="0.0">review-required</tspan></text><text x="889.3333333333333" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end"><tspan x="889.3333333333333" dy="0.0">0.65 - 0.85</tspan></text><text x="670.6666666666666" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="670.6666666666666" dy="0.0">needs a person to approve</tspan></text><rect x="913.3333333333333" y="176" width="246.66666666666666" height="78" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="927.3333333333333" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#15803d" text-anchor="start"><tspan x="927.3333333333333" dy="0.0">auto-map</tspan></text><text x="1146.0" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end"><tspan x="1146.0" dy="0.0">&gt;= 0.85</tspan></text><text x="927.3333333333333" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="927.3333333333333" dy="0.0">plus &gt;= 2 evidence classes, no</tspan><tspan x="927.3333333333333" dy="16.2">tie</tspan></text><text x="400" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="start" font-style="italic"><tspan x="400" dy="0.0">Without git evidence realistic requirements score about 0.36, so a real repository is usually blocked.</tspan></text><rect x="400" y="320" width="760" height="140" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="436" cy="354" r="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><path d="M436 343.56 L445.0 348.24 V354.9 Q445.0 362.1 436 365.16 Q427.0 362.1 427.0 354.9 V348.24 Z" fill="#6d28d9"/><text x="466" y="354" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#6d28d9" text-anchor="start"><tspan x="466" dy="0.0">Document-declared target  (in review, not on main yet)</tspan></text><text x="466" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start"><tspan x="466" dy="0.0">Implementation target: src/features/payment/PaymentForm.tsx#PaymentForm</tspan></text><text x="466" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start"><tspan x="466" dy="0.0">Grounded in the repository index (file exists, symbol exported) -&gt; listed first as</tspan><tspan x="466" dy="16.9">review-required. Weight 0: it never raises confidence and never produces auto-map. Ungrounded</tspan><tspan x="466" dy="16.9">-&gt; DECLARED_TARGET_NOT_FOUND.</tspan></text><text x="1200" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="1200" dy="0.0">Acceptance</tspan></text><rect x="1200" y="176" width="360" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><circle cx="1230" cy="216" r="15" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><path d="M1223.25 216 l4.8 5.1000000000000005 l9.0 -9.9" fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1256" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#15803d" text-anchor="start"><tspan x="1256" dy="0.0">AUTO_MAP</tspan></text><text x="1256" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="1256" dy="0.0">auto-map, accepted candidate listed, &gt;=</tspan><tspan x="1256" dy="16.2">0.85</tspan></text><rect x="1200" y="268" width="360" height="80" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><circle cx="1230" cy="308" r="15" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><path d="M1230 299.3 L1237.5 303.2 V308.75 Q1237.5 314.75 1230 317.3 Q1222.5 314.75 1222.5 308.75 V303.2 Z" fill="#6d28d9"/><text x="1256" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#6d28d9" text-anchor="start"><tspan x="1256" dy="0.0">HUMAN_APPROVAL</tspan></text><text x="1256" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="1256" dy="0.0">review-required + valid, current,</tspan><tspan x="1256" dy="16.2">hash-bound approval of a listed candidate</tspan></text><rect x="1200" y="360" width="360" height="80" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><circle cx="1230" cy="400" r="15" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><path d="M1224.3 394.3 L1235.7 405.7 M1235.7 394.3 L1224.3 405.7" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round"/><text x="1256" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#b91c1c" text-anchor="start"><tspan x="1256" dy="0.0">NONE</tspan></text><text x="1256" y="414" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="start"><tspan x="1256" dy="0.0">blocked, missing, unknown, stale or forged</tspan><tspan x="1256" dy="16.2">approval</tspan></text><line x1="342" y1="168" x2="396" y2="200" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-muted)"/><line x1="1164" y1="210" x2="1196" y2="210" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow-muted)"/><line x1="1164" y1="395" x2="1196" y2="310" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arrow-violet)"/><text x="40" y="486" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start"><tspan x="40" dy="0.0">Human approval lifecycle</tspan></text><rect x="40.0" y="500" width="357.5" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="58.0" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="58.0" dy="0.0">tdd plan lists candidates (stable ids)</tspan></text><line x1="400.5" y1="538" x2="424.5" y2="538" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><rect x="427.5" y="500" width="357.5" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="445.5" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="445.5" dy="0.0">mapping approve writes</tspan><tspan x="445.5" dy="18.9">.testgen/approvals/&lt;req&gt;.json</tspan></text><line x1="788.0" y1="538" x2="812.0" y2="538" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><rect x="815.0" y="500" width="357.5" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="833.0" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="833.0" dy="0.0">tdd plan --mapping-approval -&gt;</tspan><tspan x="833.0" dy="18.9">READY_FOR_RED</tspan></text><line x1="1175.5" y1="538" x2="1199.5" y2="538" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/><rect x="1202.5" y="500" width="357.5" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/><text x="1220.5" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start"><tspan x="1220.5" dy="0.0">any edit to document, requirement,</tspan><tspan x="1220.5" dy="18.9">profile or decision -&gt; stale</tspan></text><rect y="654" width="1600" height="46" fill="#1e3a8a"/><text x="800.0" y="682" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#dbeafe" text-anchor="middle"><tspan x="800.0" dy="0.0">Conduit only passes an approval file path. It never creates an approval, and blocked can never be approved.</tspan></text></svg>
